<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalyst Wings | Digital Marketing Agency</title>
  <meta name="description" content="Catalyst Wings helps businesses grow with SEO, Google Business Profile optimization, digital marketing, and content writing.">
  <style>
    :root{--navy:#031f3b;--blue:#078ff0;--cyan:#18b4ff;--ink:#092b50;--muted:#62758b;--pale:#f5f9fd;--line:#dce8f3;--white:#fff}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}a{text-decoration:none;color:inherit}img{max-width:100%;display:block}.wrap{width:min(1180px,92%);margin-inline:auto}
    header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e4edf5}.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:28px}.logo{width:210px;height:66px;object-fit:contain}.nav-links{display:flex;align-items:center;gap:28px;font-weight:700}.nav-links a{transition:color .2s}.nav-links a:hover{color:var(--blue)}.contact-btn{background:var(--blue);color:#fff;padding:12px 22px;border-radius:28px}.contact-btn:hover{color:#fff!important;background:#0676c7}
    .hero{position:relative;overflow:hidden;background:linear-gradient(110deg,#031f3b,#064a78 65%,#082c4c);color:#fff;padding:82px 0}.hero:before{content:"";position:absolute;width:430px;height:430px;border:1px solid #ffffff18;border-radius:50%;right:-140px;top:-190px}.hero-grid{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:54px;align-items:center}.tag{color:var(--cyan);letter-spacing:4px;text-transform:uppercase;font-size:12px;font-weight:800}.hero h1{font-size:clamp(42px,5.5vw,68px);line-height:1.04;letter-spacing:-1.8px;margin:16px 0}.hero h1 span,h2 span{color:var(--cyan)}.hero-copy{font-size:18px;line-height:1.8;color:#e4f2fc;max-width:620px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--blue);color:#fff;padding:14px 24px;border-radius:28px;font-weight:700;margin-top:18px;transition:transform .2s,background .2s}.btn:hover{background:#087dcc;transform:translateY(-2px)}.hero-note{margin-top:22px;font-size:13px;color:#c6e3f8}
    .visual{background:#082b4a;border:1px solid #397090;border-radius:24px;padding:20px;box-shadow:0 25px 60px #00152655;transform:rotate(1deg)}.visual-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;color:#d8efff;font-size:13px}.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#31d5a0;margin-right:7px}.screen{min-height:265px;background:linear-gradient(145deg,#0c426c,#061f38);border-radius:15px;padding:20px}.screen-title{font-size:14px;color:#dcefff}.bars{height:160px;display:flex;gap:13px;align-items:end;padding:12px 4px 0}.bar{flex:1;background:linear-gradient(#16b8ff,#0879dd);border-radius:5px 5px 0 0;min-height:25%}.bar:nth-child(1){height:35%}.bar:nth-child(2){height:48%}.bar:nth-child(3){height:43%}.bar:nth-child(4){height:65%}.bar:nth-child(5){height:57%}.bar:nth-child(6){height:82%}.bar:nth-child(7){height:100%}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.stats div{background:#0c4168;padding:13px;border-radius:10px;color:#fff;font-size:12px}.stats b{display:block;color:var(--cyan);font-size:20px;margin-bottom:4px}
    section{padding:82px 0}.heading{text-align:center;max-width:760px;margin:0 auto 42px}.heading small{color:var(--blue);letter-spacing:4px;text-transform:uppercase;font-weight:800}.heading h2,h2{font-size:clamp(32px,4vw,44px);margin:12px 0;line-height:1.12;letter-spacing:-.8px}.heading p,.card p,.about p{color:var(--muted);line-height:1.75}.services{background:var(--pale)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}.card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 10px 30px #0b355f0c;transition:transform .25s,box-shadow .25s}.card:hover{transform:translateY(-7px);box-shadow:0 18px 38px #0b355f18}.art{height:180px;overflow:hidden;background:linear-gradient(135deg,#07345a,#079df2)}.art img{width:100%;height:100%;object-fit:cover;transition:transform .4s}.card:hover .art img{transform:scale(1.05)}.card-body{display:flex;flex:1;flex-direction:column;padding:22px}.card h3{font-size:21px;margin:0 0 9px}.card p{font-size:14px;margin:0 0 20px}.learn{margin-top:auto;color:var(--blue);font-weight:800}.learn:hover{color:#045d9f}
    .about-grid{display:grid;grid-template-columns:1fr 1fr;gap:54px;align-items:center}.about-box{background:linear-gradient(135deg,#05294a,#086399);color:#fff;border-radius:22px;padding:38px;box-shadow:0 20px 45px #05294a1c}.about-box h2{font-size:clamp(30px,3.5vw,40px)}.about-box p{color:#e1f0fa;line-height:1.75}.checks{display:grid;gap:17px;margin-top:26px}.check{display:flex;gap:12px;align-items:flex-start;line-height:1.55}.check i{flex:0 0 25px;background:#09a2f3;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800}.about .tag{color:var(--blue)}.about p{margin:14px 0}
    .contact{background:var(--pale)}.contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:26px;align-items:stretch}.contact-card{background:#fff;padding:30px;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 30px #0b355f0b}.contact-card h3{font-size:23px;margin:0 0 22px}.item{display:flex;gap:14px;align-items:center;margin:19px 0;color:var(--ink)}.item:hover b{color:var(--blue)}.ico{flex:0 0 44px;width:44px;height:44px;border-radius:50%;background:#e7f5ff;color:var(--blue);display:grid;place-items:center;font-weight:800}.item small{color:var(--muted)}form{display:grid;gap:14px}input,textarea{font:inherit;padding:14px 15px;border:1px solid #d6e3ee;border-radius:9px;width:100%;color:var(--ink);background:#fff}input:focus,textarea:focus{outline:2px solid #078ff033;border-color:var(--blue)}textarea{min-height:130px;resize:vertical}button{border:0;cursor:pointer;font:inherit}.form-note{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
    footer{background:#031e38;color:#fff;padding:32px 0}.foot{display:flex;justify-content:space-between;align-items:center;gap:22px}.foot small{color:#c4d8e8}.social{display:flex;gap:10px}.social a{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#0b466f;transition:background .2s}.social a:hover{background:var(--blue)}
    @media(max-width:950px){.hero-grid{grid-template-columns:1fr  .85fr;gap:28px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.about-grid{gap:30px}.nav-links{gap:16px}}
    @media(max-width:720px){.nav{padding:10px 0;flex-wrap:wrap;justify-content:center}.logo{height:55px}.nav-links{width:100%;justify-content:center;flex-wrap:wrap;gap:12px 18px;padding-bottom:8px}.hero{padding:62px 0}.hero-grid,.about-grid,.contact-grid{grid-template-columns:1fr}.visual{transform:none}.screen{min-height:230px}.bars{height:130px}section{padding:62px 0}.about-box{padding:28px}.foot{flex-direction:column;text-align:center}}
    @media(max-width:480px){.wrap{width:90%}.hero h1{font-size:42px}.hero-copy{font-size:16px}.cards{grid-template-columns:1fr}.art{height:205px}.heading{margin-bottom:30px}.contact-card{padding:23px}.nav-links a{font-size:14px}.contact-btn{padding:10px 16px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important;animation:none!important}}
  </style>
